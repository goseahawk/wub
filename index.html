<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>wubb</title>
  <meta name="description" content="wubb — the album by wubb." />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="wubb" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 12c2-6 4-6 5 0s3 6 5 0 3-6 5 0 3 6 5 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span>wubb</span>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="#">
          <svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home
        </a>
      </nav>
      <div class="library">
        <div class="library-title">Your Library</div>
        <a class="lib-item" href="#">
          <img src="assets/cover.jpg" alt="" />
          <div><div class="lib-name">wubb</div><div class="lib-sub">Album · wubb</div></div>
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <header class="hero">
        <img class="hero-cover" id="heroCover" src="assets/cover.jpg" alt="wubb album cover" />
        <div class="hero-meta">
          <div class="hero-type" id="heroType">Album</div>
          <h1 class="hero-title" id="heroTitle">wubb</h1>
          <div class="hero-sub" id="heroSub"></div>
        </div>
      </header>

      <section class="actions">
        <button class="big-play" id="bigPlay" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="icon-btn js-shuffle" aria-label="Shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M14.5 4H20v5.5l-2-2-3.6 3.6-1.4-1.4L16.6 6zM4 5.4 5.4 4l13.4 13.4 1.2-1.2V20h-5.5l2-2L4 5.4zM4 18.6l5.3-5.3 1.4 1.4L5.4 20z"/></svg>
        </button>
        <button class="install-btn" id="installBtn" hidden>
          <svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>
          Add to Home Screen
        </button>
      </section>

      <section class="tracklist" id="tracklist">
        <div class="tl-head">
          <span class="c-num">#</span>
          <span class="c-title">Title</span>
          <span class="c-dur" title="Duration">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3z"/></svg>
          </span>
        </div>
        <ol class="tl-body" id="tlBody"></ol>
      </section>

      <footer class="album-foot" id="albumFoot"></footer>
    </main>

    <!-- Player bar -->
    <footer class="player">
      <div class="now" id="openNow" role="button" tabindex="0" aria-label="Open Now Playing">
        <img src="assets/cover.jpg" alt="" />
        <div class="now-text">
          <div class="now-title js-title">—</div>
          <div class="now-artist js-artist">wubb</div>
        </div>
      </div>
      <button class="play-btn mini-play js-play" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div class="mini-progress"><i></i></div>

      <div class="controls">
        <div class="buttons ">
          <button class="icon-btn js-shuffle" aria-label="Shuffle" title="Shuffle (S)">
            <svg viewBox="0 0 24 24"><path d="M14.5 4H20v5.5l-2-2-3.6 3.6-1.4-1.4L16.6 6zM4 5.4 5.4 4l13.4 13.4 1.2-1.2V20h-5.5l2-2L4 5.4zM4 18.6l5.3-5.3 1.4 1.4L5.4 20z"/></svg>
          </button>
          <button class="icon-btn js-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button class="play-btn js-play" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="icon-btn js-next" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn js-repeat" aria-label="Repeat" title="Repeat (R)">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
            <span class="repeat-one">1</span>
          </button>
        </div>
        <div class="progress">
          <span class="time js-cur">0:00</span>
          <div class="scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="scrub-track"><div class="scrub-fill"></div><div class="scrub-knob"></div></div>
          </div>
          <span class="time js-dur">0:00</span>
        </div>
      </div>

      <div class="extras">
        <button class="icon-btn" id="muteBtn" aria-label="Mute">
          <svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <input type="range" class="slider vol" id="volume" min="0" max="100" value="80" aria-label="Volume" />
      </div>
    </footer>
  </div>

  <!-- Now Playing (full screen) -->
  <section class="np" id="np" hidden aria-label="Now Playing">
    <div class="np-inner" id="npInner">
      <header class="np-head">
        <button class="icon-btn np-close" id="npClose" aria-label="Close Now Playing">
          <svg viewBox="0 0 24 24"><path d="M5.6 8.3 12 14.7l6.4-6.4 1.4 1.4-7.8 7.8-7.8-7.8z"/></svg>
        </button>
        <div class="np-from">
          <div class="np-from-label">Playing from album</div>
          <div class="np-from-name" id="npAlbum">wubb</div>
        </div>
        <span class="np-spacer"></span>
      </header>
      <img class="np-cover" id="npCover" src="assets/cover.jpg" alt="Album cover" />
      <div class="np-meta">
        <div class="np-title js-title">—</div>
        <div class="np-artist js-artist">wubb</div>
      </div>
      <div class="np-progress">
        <div class="scrub" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="scrub-track"><div class="scrub-fill"></div><div class="scrub-knob"></div></div>
          </div>
        <div class="np-times"><span class="js-cur">0:00</span><span class="js-dur">0:00</span></div>
      </div>
      <div class="buttons np-buttons">
          <button class="icon-btn js-shuffle" aria-label="Shuffle" title="Shuffle (S)">
            <svg viewBox="0 0 24 24"><path d="M14.5 4H20v5.5l-2-2-3.6 3.6-1.4-1.4L16.6 6zM4 5.4 5.4 4l13.4 13.4 1.2-1.2V20h-5.5l2-2L4 5.4zM4 18.6l5.3-5.3 1.4 1.4L5.4 20z"/></svg>
          </button>
          <button class="icon-btn js-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button class="play-btn js-play" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="icon-btn js-next" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn js-repeat" aria-label="Repeat" title="Repeat (R)">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
            <span class="repeat-one">1</span>
          </button>
        </div>
    </div>
  </section>

  <!-- Add-to-home-screen instructions (phones without a native install prompt) -->
  <div class="sheet-backdrop" id="installSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <img src="assets/icon-192.png" alt="" class="sheet-icon" />
      <h2 id="sheetTitle">Add wubb to your Home Screen</h2>
      <ol class="sheet-steps" id="sheetSteps"></ol>
      <button class="sheet-close" id="sheetClose">Got it</button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="album.js"></script>
  <script src="app.js"></script>
  <script src="install.js"></script>
</body>
</html>
